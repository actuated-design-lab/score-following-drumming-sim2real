seed: 2
device: cuda:0
num_steps_per_env: 120
max_iterations: 1500
empirical_normalization: null
obs_groups: {}
clip_actions: null
save_interval: 50
experiment_name: porcaro_rslrl_mlp_gen2
run_name: E_b_seed2
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 0.5
  noise_std_type: scalar
  actor_obs_normalization: true
  critic_obs_normalization: true
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.002
  desired_kl: 0.02
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
